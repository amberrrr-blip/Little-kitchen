<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>題目在哪兒</title>
<style>
:root{--bg:#241a3d;--panel:#30244f;--panel2:#3a2d5f;--line:#4d3f77;--ink:#f6efe8;--mute:#b9aed4;--or:#ffb585;--or2:#ffd9bd;--dark:#241a3d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding-top:env(safe-area-inset-top,0)}
header{padding:22px 18px 0;max-width:960px;margin:0 auto}
h1{margin:0;font-size:2.1rem;letter-spacing:.12em;color:var(--or2);font-weight:800}
.sub{color:var(--mute);font-size:.9rem;margin:2px 0 14px}
nav{display:flex;gap:6px;overflow-x:auto;border-bottom:2px solid var(--line)}
nav button{flex:1;min-width:84px;background:none;border:0;color:var(--mute);padding:11px 8px;font:inherit;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
nav button.on{color:var(--or);border-color:var(--or)}
main{max-width:960px;margin:0 auto;padding:18px 18px calc(40px + env(safe-area-inset-bottom,0))}
section{display:none}section.on{display:block}
h2{font-size:1.2rem;margin:0 0 12px;color:var(--or2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
label{display:block;font-size:.85rem;color:var(--mute);margin:8px 0 3px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 10px;font:inherit}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--or);outline-offset:1px}
.btn{background:var(--or);color:var(--dark);border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:none;color:var(--or);border:1px solid var(--or)}
.btn.sm{padding:4px 10px;font-size:.82rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:120px}
.row .btn{flex:none}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h b{font-size:1.15rem;color:var(--or2)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;color:var(--mute);font-size:.8rem}
.day{aspect-ratio:1/1;background:var(--panel2);border:1px solid transparent;border-radius:8px;color:var(--ink);font:inherit;cursor:pointer;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px}
.day.empty{background:none;cursor:default}
.day.today{border-color:var(--or2)}
.day.sel{background:var(--or);color:var(--dark);font-weight:800}
.dot{font-size:.65rem;background:var(--or);color:var(--dark);border-radius:9px;padding:0 6px;line-height:1.4}
.day.sel .dot{background:var(--dark);color:var(--or)}
.item{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item .t{flex:1;white-space:pre-wrap;word-break:break-word}
.tag{display:inline-block;font-size:.75rem;border:1px solid var(--or);color:var(--or);border-radius:20px;padding:0 9px;margin-right:6px}
.ans{color:var(--mute);font-size:.88rem}
.empty-msg{color:var(--mute);padding:8px 0}
#printArea{display:none}
@media print{
 body>*{display:none!important}
 body>#printArea{display:block!important;color:#000;background:#fff;padding:0;font-size:12pt}
 #printArea h1{color:#000;font-size:20pt;text-align:center;letter-spacing:0}
 #printArea .q{margin:0 0 14pt;white-space:pre-wrap;page-break-inside:avoid}
 #printArea .pb{page-break-before:always}
}
</style>
</head>
<body>
<header>
 <h1>題目在哪兒</h1>
 <p class="sub">考古題整理與出題參考</p>
 <nav id="nav">
  <button data-p="home" class="on">首頁</button>
  <button data-p="make">出題</button>
  <button data-p="rec">出卷紀錄</button>
  <button data-p="bank">考古題總集</button>
 </nav>
</header>
<main>

<section id="home" class="on">
 <div class="card">
  <div class="cal-h"><button class="btn ghost sm" id="prev">上個月</button><b id="mlabel"></b><button class="btn ghost sm" id="next">下個月</button></div>
  <div class="grid" id="dows"></div>
  <div class="grid" id="cal" style="margin-top:4px"></div>
 </div>
 <div class="card">
  <h2 id="dlabel">選擇日期</h2>
  <div class="row">
   <div><label for="evT">考卷名稱</label><input id="evT" placeholder="例如：國文第二次段考"></div>
   <button class="btn" id="evAdd">新增考試</button>
  </div>
  <div id="evList"></div>
 </div>
</section>

<section id="make">
 <div class="card">
  <h2>新增題目到考卷</h2>
  <label for="pTitle">考卷標題</label><input id="pTitle" placeholder="例如：國文第二次段考">
  <label for="mQ">題目</label><textarea id="mQ" placeholder="輸入題目內容，選擇題可把選項寫在下面幾行"></textarea>
  <label for="mA">答案（選填）</label><input id="mA">
  <div class="bar"><button class="btn" id="mAdd">加入考卷</button></div>
  <label for="mPick">或從考古題總集挑選</label>
  <div class="row"><select id="mPick"></select><button class="btn ghost" id="mPickAdd">加入考卷</button></div>
 </div>
 <div class="card">
  <h2>目前考卷（<span id="mCount">0</span> 題）</h2>
  <div id="mList"></div>
  <label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="withAns" style="width:auto"> 輸出時附上答案頁</label>
  <div class="bar">
   <button class="btn" id="mSave">存到出卷紀錄</button>
   <button class="btn ghost" id="mPdf">輸出 PDF</button>
   <button class="btn ghost" id="mDoc">輸出 Pages 檔</button>
   <button class="btn ghost" id="mClear">清空</button>
  </div>
 </div>
</section>

<section id="rec">
 <div class="card"><h2>出卷紀錄</h2><div id="recList"></div></div>
</section>

<section id="bank">
 <div class="card">
  <h2>新增考古題</h2>
  <div class="row">
   <div><label for="bY">年份</label><input id="bY" type="number" placeholder="2025"></div>
   <div><label for="bC">分類</label><input id="bC" list="cats" placeholder="例如：國文／閱讀"><datalist id="cats"></datalist></div>
  </div>
  <label for="bQ">題目</label><textarea id="bQ"></textarea>
  <label for="bA">答案（選填）</label><input id="bA">
  <div class="bar"><button class="btn" id="bAdd">新增題目</button></div>
 </div>
 <div class="card">
  <h2>篩選</h2>
  <div class="row">
   <div><label for="fY">年份</label><select id="fY"></select></div>
   <div><label for="fC">分類</label><select id="fC"></select></div>
  </div>
 </div>
 <div class="card" id="bList"></div>
</section>

</main>
<div id="printArea"></div>

<script>
var KEY="tmzne_v1";
var S={events:[],bank:[],papers:[],draft:[],title:""};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);for(var k in S)if(o[k]!==undefined)S[k]=o[k];}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function pad(n){return n<10?"0"+n:""+n}
function ds(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}

/* nav */
function go(p){
 document.querySelectorAll("section").forEach(function(s){s.classList.toggle("on",s.id===p)});
 document.querySelectorAll("#nav button").forEach(function(b){b.classList.toggle("on",b.dataset.p===p)});
 window.scrollTo(0,0);
}
document.querySelectorAll("#nav button").forEach(function(b){b.onclick=function(){go(b.dataset.p)}});

/* calendar */
var cur=new Date();cur.setDate(1);var sel=ds(new Date());
"日一二三四五六".split("").forEach(function(t){var d=document.createElement("div");d.className="dow";d.textContent=t;$("dows").appendChild(d)});
function renderCal(){
 $("mlabel").textContent=cur.getFullYear()+" 年 "+(cur.getMonth()+1)+" 月";
 var h="",first=cur.getDay(),n=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate(),today=ds(new Date());
 for(var i=0;i<first;i++)h+='<div class="day empty"></div>';
 for(var d=1;d<=n;d++){
  var key=cur.getFullYear()+"-"+pad(cur.getMonth()+1)+"-"+pad(d);
  var c=S.events.filter(function(e){return e.date===key}).length;
  h+='<button class="day'+(key===today?" today":"")+(key===sel?" sel":"")+'" data-d="'+key+'">'+d+(c?'<span class="dot">'+c+'</span>':"")+'</button>';
 }
 $("cal").innerHTML=h;
 $("cal").querySelectorAll("button").forEach(function(b){b.onclick=function(){sel=b.dataset.d;renderCal();renderEv()}});
}
function renderEv(){
 $("dlabel").textContent=sel+" 的考試";
 var l=S.events.filter(function(e){return e.date===sel});
 $("evList").innerHTML=l.length?l.map(function(e){return '<div class="item"><div class="t">'+esc(e.title)+'</div><button class="btn ghost sm" data-del="'+e.id+'">刪除</button></div>'}).join(""):'<div class="empty-msg">這天還沒有考試，輸入名稱後按「新增考試」。</div>';
 $("evList").querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){S.events=S.events.filter(function(e){return e.id!==b.dataset.del});save();renderCal();renderEv()}});
}
$("prev").onclick=function(){cur.setMonth(cur.getMonth()-1);renderCal()};
$("next").onclick=function(){cur.setMonth(cur.getMonth()+1);renderCal()};
$("evAdd").onclick=function(){
 var t=$("evT").value.trim();if(!t){$("evT").focus();return}
 S.events.push({id:uid(),date:sel,title:t});$("evT").value="";save();renderCal();renderEv();
};

/* draft paper */
function renderDraft(){
 $("pTitle").value=S.title;$("mCount").textContent=S.draft.length;
 $("mList").innerHTML=S.draft.length?S.draft.map(function(q,i){return '<div class="item"><div class="t"><b>'+(i+1)+'.</b> '+esc(q.q)+(q.a?'<div class="ans">答案：'+esc(q.a)+'</div>':"")+'</div><button class="btn ghost sm" data-rm="'+i+'">移除</button></div>'}).join(""):'<div class="empty-msg">考卷還是空的，從上方加入題目。</div>';
 $("mList").querySelectorAll("[data-rm]").forEach(function(b){b.onclick=function(){S.draft.splice(+b.dataset.rm,1);save();renderDraft()}});
}
$("pTitle").oninput=function(){S.title=this.value;save()};
$("mAdd").onclick=function(){
 var q=$("mQ").value.trim();if(!q){$("mQ").focus();return}
 S.draft.push({q:q,a:$("mA").value.trim()});$("mQ").value="";$("mA").value="";save();renderDraft();
};
$("mPickAdd").onclick=function(){
 var b=S.bank.filter(function(x){return x.id===$("mPick").value})[0];if(!b)return;
 S.draft.push({q:b.q,a:b.a});save();renderDraft();
};
$("mClear").onclick=function(){if(confirm("確定清空目前的考卷？")){S.draft=[];S.title="";save();renderDraft()}};
$("mSave").onclick=function(){
 if(!S.draft.length){alert("考卷是空的，先加入題目。");return}
 S.papers.unshift({id:uid(),title:S.title||"未命名考卷",date:ds(new Date()),items:S.draft.slice()});
 save();renderRec();go("rec");
};
function paperHTML(title,items,ans){
 var h="<h1>"+esc(title||"考卷")+"</h1>";
 items.forEach(function(q,i){h+='<div class="q"><b>'+(i+1)+".</b> "+esc(q.q).replace(/\n/g,"<br>")+"</div>"});
 if(ans){h+='<div class="pb"><h1>答案</h1>';items.forEach(function(q,i){h+='<div class="q">'+(i+1)+". "+esc(q.a||"（未填）")+"</div>"});h+="</div>"}
 return h;
}
function toPdf(title,items){
 if(!items.length){alert("考卷是空的。");return}
 $("printArea").innerHTML=paperHTML(title,items,$("withAns").checked);
 var old=document.title;document.title=title||"考卷";
 window.print();document.title=old;
 alert("PDF 輸出方式：在列印視窗選擇「另存為 PDF」。");
}
function toDoc(title,items){
 if(!items.length){alert("考卷是空的。");return}
 var html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>'+esc(title)+'</title></head><body>'+paperHTML(title,items,$("withAns").checked).replace('class="pb"','style="page-break-before:always"')+"</body></html>";
 var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+html],{type:"application/msword"}));
 a.download=(title||"考卷")+".doc";document.body.appendChild(a);a.click();a.remove();
}
$("mPdf").onclick=function(){toPdf(S.title,S.draft)};
$("mDoc").onclick=function(){toDoc(S.title,S.draft)};

/* records */
function renderRec(){
 $("recList").innerHTML=S.papers.length?S.papers.map(function(p){return '<div class="item"><div class="t"><b>'+esc(p.title)+'</b><div class="ans">'+p.date+"・"+p.items.length+' 題</div></div><div class="bar" style="margin:0"><button class="btn sm" data-ld="'+p.id+'">載入</button><button class="btn ghost sm" data-pf="'+p.id+'">PDF</button><button class="btn ghost sm" data-dc="'+p.id+'">Pages 檔</button><button class="btn ghost sm" data-dl="'+p.id+'">刪除</button></div></div>'}).join(""):'<div class="empty-msg">還沒有紀錄。在「出題」頁按「存到出卷紀錄」就會出現在這裡。</div>';
 function find(id){return S.papers.filter(function(p){return p.id===id})[0]}
 $("recList").querySelectorAll("[data-ld]").forEach(function(b){b.onclick=function(){var p=find(b.dataset.ld);S.title=p.title;S.draft=p.items.slice();save();renderDraft();go("make")}});
 $("recList").querySelectorAll("[data-pf]").forEach(function(b){b.onclick=function(){var p=find(b.dataset.pf);toPdf(p.title,p.items)}});
 $("recList").querySelectorAll("[data-dc]").forEach(function(b){b.onclick=function(){var p=find(b.dataset.dc);toDoc(p.title,p.items)}});
 $("recList").querySelectorAll("[data-dl]").forEach(function(b){b.onclick=function(){if(confirm("刪除這筆紀錄？")){S.papers=S.papers.filter(function(p){return p.id!==b.dataset.dl});save();renderRec()}}});
}

/* bank */
function uniq(a){return a.filter(function(v,i){return v&&a.indexOf(v)===i})}
function renderBank(){
 var ys=uniq(S.bank.map(function(b){return String(b.y)})).sort().reverse(),cs=uniq(S.bank.map(function(b){return b.c})).sort();
 var fy=$("fY").value||"",fc=$("fC").value||"";
 $("fY").innerHTML='<option value="">全部年份</option>'+ys.map(function(y){return '<option value="'+esc(y)+'">'+esc(y)+"</option>"}).join("");
 $("fC").innerHTML='<option value="">全部分類</option>'+cs.map(function(c){return '<option value="'+esc(c)+'">'+esc(c)+"</option>"}).join("");
 $("fY").value=ys.indexOf(fy)>-1?fy:"";$("fC").value=cs.indexOf(fc)>-1?fc:"";
 $("cats").innerHTML=cs.map(function(c){return '<option value="'+esc(c)+'">'}).join("");
 var l=S.bank.filter(function(b){return(!$("fY").value||String(b.y)===$("fY").value)&&(!$("fC").value||b.c===$("fC").value)});
 $("bList").innerHTML=l.length?l.map(function(b){return '<div class="item"><div class="t"><span class="tag">'+esc(b.y)+'</span><span class="tag">'+esc(b.c)+"</span><div>"+esc(b.q)+"</div>"+(b.a?'<div class="ans">答案：'+esc(b.a)+"</div>":"")+'</div><div class="bar" style="margin:0"><button class="btn sm" data-use="'+b.id+'">加入考卷</button><button class="btn ghost sm" data-del="'+b.id+'">刪除</button></div></div>'}).join(""):'<div class="empty-msg">'+(S.bank.length?"沒有符合篩選的題目。":"題庫是空的，在上方新增第一題。")+"</div>";
 $("bList").querySelectorAll("[data-use]").forEach(function(x){x.onclick=function(){var b=S.bank.filter(function(z){return z.id===x.dataset.use})[0];S.draft.push({q:b.q,a:b.a});save();renderDraft();x.textContent="已加入"}});
 $("bList").querySelectorAll("[data-del]").forEach(function(x){x.onclick=function(){if(confirm("刪除這題？")){S.bank=S.bank.filter(function(z){return z.id!==x.dataset.del});save();renderBank();renderPick()}}});
}
function renderPick(){
 $("mPick").innerHTML=S.bank.length?S.bank.map(function(b){var t=b.q.replace(/\s+/g," ");return '<option value="'+b.id+'">'+esc(b.y+" "+b.c+"｜"+(t.length>24?t.slice(0,24)+"…":t))+"</option>"}).join(""):'<option value="">題庫是空的</option>';
}
$("fY").onchange=$("fC").onchange=renderBank;
$("bAdd").onclick=function(){
 var y=$("bY").value.trim(),c=$("bC").value.trim(),q=$("bQ").value.trim();
 if(!y||!c||!q){alert("請填寫年份、分類和題目。");return}
 S.bank.unshift({id:uid(),y:y,c:c,q:q,a:$("bA").value.trim()});
 $("bQ").value="";$("bA").value="";save();renderBank();renderPick();
};

renderCal();renderEv();renderDraft();renderRec();renderBank();renderPick();
</script>
</body>
</html>
